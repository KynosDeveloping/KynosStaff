      lore:
        - "&8« Quick Action »"
        - ""
        - " &#3ac1ff➔ Left Click &8• &7Teleport to them"
        - " &#a3e043➔ Right Click &8• &7Teleport them to you"
    globalmute:
      name-unmuted: "&#5ca904✔ Chat Status: UNMUTED"
      name-muted: "&#a90404✖ Chat Status: MUTED"
      lore:
        - "&8« Global Chat »"
        - ""
        - " &7Click to lock or unlock"
        - " &7the global chat."
    quickrtp:
      name: "&#0cb16e✦ Quick Patrol RTP"
      lore:
        - "&8« Random Teleport »"
        - ""
        - " &7Teleport instantly to a"
        - " &7random active player."
  PlayerList:
    title: "&#f3b23eManage Players &8• &#a0a0a0Page {page}"
    player-head:
      name: "&#0ca2a2👤 {player}"
      lore:
        - "&8« Player Actions »"
        - ""
        - " &#ff4b4b➔ Right Click &8• &7Open moderation menu"
  AutomanagementGui:
    title: "&#f3b23eManaging: &#59e2e2Yourself"
    items:
      fly:
        name: "&#0ca2a2✈ Toggle Fly"
        lore:
          - "&8« Ability »"
          - ""
          - " &7Enable or disable your"
          - " &7ability to fly."
      godmode:
        name: "&#ffb03a🛡 Toggle Godmode"
        lore:
          - "&8« Ability »"
          - ""
          - " &7Become completely invulnerable"
          - " &7to any type of damage."
      vanish:
        name: "&#b23ef3👁 Toggle Vanish"
        lore:
          - "&8« Ability »"
          - ""
          - " &7Hide yourself from players"
          - " &7and from the tablist."
      trollstick:
        name: "&#f3b23e☄ Get Troll Stick"
        lore:
          - "&8« Staff Tool »"
          - ""
          - " &7Get a custom stick with"
          - " &7extreme knockback."
      nightvision:
        name: "&#643ef3🔮 Toggle Night Vision"
        lore:
          - "&8« Ability »"
          - ""
          - " &7Give or remove infinite"
          - " &7night vision effect."
      randomtp:
        name: "&#0cb16e🎲 Random Teleport"
        lore:
          - "&8« Navigation »"
          - ""
          - " &7Teleport to a random"
          - " &7player on the server."
  PlayerManagementGui:
    title: "&#ff8585Managing: &#ffd269{target}"
    items:
      teleport:
        name: "&#0cb16e➘ Teleport"
        lore:
          - " &7Teleport directly to player."
      freeze:
        name: "&#0ca2a2❄ Freeze Player"
        lore:
          - " &7Freeze or unfreeze the player."
      invsee:
        name: "&#f3b23e🔍 Inspect Inventory"
        lore:
          - " &7Open and check player's inventory."
      kick:
        name: "&#e66000🚪 Kick Player"
        lore:
          - " &7Disconnect player from the server."
      mute:
        name: "&#a90404🔇 Mute Player"
        lore:
          - " &7Select a duration to mute player."
      enderchest:
        name: "&#960ce7🔮 Open Enderchest"
        lore:
          - " &7Open and check player's enderchest."
      kill:
        name: "&#990000☠ Kill Player"
        lore:
          - " &7Instantly kill the player."
  TimeSelectionGui:
    title: "&#a0a0a0Select Duration for &c{target}"
    back-button:
      name: "&#f3b23e◀ Back to Management"
      lore:
        - " &7Return to the previous menu."
    item-format:
      name: "&#f3b23eDuration: &#59e2e2{time}"
      lore:
        - ""
        - " &7Click to apply this duration"
        - " &7to the player's sanction."
  Pagination:
    previous-page-name: "&#0cb16e◀ Previous Page"
    next-page-name: "&#0cb16eNext Page ▶"

